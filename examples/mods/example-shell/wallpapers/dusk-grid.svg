<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
<!-- Example wallpaper: a dusk sky over a soft grid. -->
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1036"/><stop offset=".55" stop-color="#6b2d6f"/><stop offset="1" stop-color="#ff8a7a"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#ff6ad5"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1340"/><stop offset="1" stop-color="#0f0d16"/></linearGradient>
</defs>
<rect width="1920" height="1080" fill="url(#sky)"/>
